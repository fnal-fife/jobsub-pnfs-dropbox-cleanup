# This workflow will build a golang project and run the unit tests
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go build and test

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CI: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Populate vendor dir
      run: go mod vendor

    - name: Install dependencies
      run: go install ./...

    - name: Build
      run: go build -v ./...

    - name: Create missing executables
      run: >
        touch $RUNNER_TEMP/htgettoken
        $RUNNER_TEMP/httokendecode
        $RUNNER_TEMP/condor_status
        $RUNNER_TEMP/condor_config_val
        $RUNNER_TEMP/condor_q

    - name: Change perms on missing executables
      run: >
        chmod +x $RUNNER_TEMP/htgettoken;
        chmod +x $RUNNER_TEMP/httokendecode;
        chmod +x $RUNNER_TEMP/condor_*;

    - name: Extend PATH
      run: echo "$RUNNER_TEMP" >> $GITHUB_PATH

    - name: Test
      run: go test -v ./...