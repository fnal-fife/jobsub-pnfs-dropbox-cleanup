timeout: "10m"
totalFileCountLimit: 9
# totalFileCountLimit: 50
# deleteFilesOlderThan: "720h"  # 30 days
deleteFilesOlderThan: "1s"  # 30 days
dCacheHostPort: ***REMOVED***
exptNameOverride:
  "gm2": "GM2/resilient/jobsub_stage"
  "mu2e": "mu2e/scratch/users/sbhat/fake_resilient/jobsub_stage/"  # TODO This is just for testing

gfal2:
  retryCount: 5
  retrySleep: "2s"

condor:
  pool: ***REMOVED***
  jobConstraint: "!IsUndefined(PNFS_INPUT_FILES)"
  scheddConstraint: "IsJobsubLite == true && InDowntime == false"
  authMethod: "IDTOKENS"

vault:
  server: ***REMOVED***
  # authMethod: "kerberos" # "kerberos" is only supported method
  # kerberosKeytabPath: /path/to/keytab 
  # kerberosPrincipal: ***REMOVED***
  experiment: "mu2e"
  # experiment: "fermilab"
  role: ""
  # role: "jobsubadmin"
  vaultTokenFile: "/var/lib/jobsub-pnfs-dropbox-cleanup/vt_token-test"
  # defaultVaultTokenFile  = "/var/lib/jobsub-pnfs-dropbox-cleanup/vt_token"
  bearerTokenFile: "/tmp/bt_jobsub-pnfs-dropbox-cleanup-test"
  # defaultBearerTokenFile = "/tmp/bt_jobsub-pnfs-dropbox-cleanup"
  vaultTokenAgeCutoff: "168h" # 7 days
  minVaultTokenTimeLeft: "72h" # 3 days

loki:
  url: ***REMOVED***
  environment: "dev"
  service: "jobsub-pnfs-dropbox-cleanup"