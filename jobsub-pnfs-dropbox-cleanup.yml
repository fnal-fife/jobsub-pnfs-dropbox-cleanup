service: "jobsub-pnfs-dropbox-cleanup"
timeout: "10m"
deleteFilesOlderThan: "720h"  # 30 days

exptNameOverride:
  "gm2": "/path/to/somewhere/else"

dCache:
  hostPort: "dCacheHost"
  apiEndpoint: "/api/v1/namespace"
  totalFileCountLimit: 50
  retryCount: 5
  retrySleep: "2s"

condor:
  pool: "collector_host.domain"
  jobConstraint: "!IsUndefined(PNFS_INPUT_FILES)"
  scheddConstraint: "IsJobsubLite == true && InDowntime == false"
  authMethod: "IDTOKENS"

vault:
  server: "vaultserver.domain"
  authMethod: "kerberos" # "kerberos" is only supported method
  kerberosKeytabPath: /path/to/keytab 
  kerberosPrincipal: "some_service_principal@REALM"
  experiment: "token-issuer"
  role: "admin_role"
  vaultTokenFile: "/var/lib/jobsub-pnfs-dropbox-cleanup/vt_token"
  bearerTokenFile: "/tmp/bt_jobsub-pnfs-dropbox-cleanup"
  vaultTokenAgeCutoff: "168h" # 7 days
  minVaultTokenTimeLeft: "72h" # 3 days

loki:
  url: "http://localhost:3100/loki/api/v1/push"
  environment: "dev"

prometheus:
  pushURL: "http://localhost:9091"